# Lint, format check and the fast test suite (no game engines, no GPU, no data downloads; a few seconds of tests).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.17.1 pytest==9.1.1 numpy==2.4.6
          # CPU-only torch: the tests export and run small networks, no GPU needed
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest
        run: pytest -q
