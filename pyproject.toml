# Tool configuration only (the repository is not an installable package).

[tool.ruff]
line-length = 120
target-version = "py311"
# agents/caretaker/main.py is a league opponent of the published run, kept byte for byte (agents/sources.json).
extend-exclude = ["vendor", "agents/caretaker"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# B905: zip(strict=...) would change behaviour where lengths differ on purpose.
# SIM115: json.load(open(path)) is used on purpose for short reads. SIM108: ternaries are not always clearer.
ignore = ["B905", "SIM115", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
